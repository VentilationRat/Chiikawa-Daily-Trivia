<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Chiikawa Trivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Daily Chiikawa Trivia</h1>
      <p id="day-label" class="muted"></p>
    </header>

    <section id="start-screen" class="panel">
      <p>Five questions, one try per day. The fastest high score tops the board.</p>
      <button id="start-btn" class="btn primary">Start today's quiz</button>
    </section>

    <section id="quiz-screen" class="panel" hidden>
      <p id="progress" class="muted"></p>
      <h2 id="question-text"></h2>
      <div id="choices" class="choices"></div>
      <button id="next-btn" class="btn primary" hidden>Next question</button>
    </section>

    <section id="result-screen" class="panel" hidden>
      <h2 id="result-score"></h2>
      <p id="result-grid" class="grid" aria-label="Your answers"></p>
      <p id="result-time" class="muted"></p>
      <button id="share-btn" class="btn">Copy result</button>

      <form id="score-form" class="score-form">
        <label for="name-input">Name for the leaderboard</label>
        <div class="row">
          <input id="name-input" maxlength="20" autocomplete="nickname" required>
          <button class="btn primary" type="submit">Add my score</button>
        </div>
      </form>
      <p id="submit-status" class="muted" role="status"></p>
    </section>

    <section class="panel board">
      <h3>Today's leaderboard</h3>
      <ol id="leaderboard-list"></ol>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
