<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Chiikawa Trivia</title>
  <link rel="icon" type="image/jpeg" href="Images/lWkmmyez_400x400.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <img class="logo" src="Images/ChiikawaModerDesign.webp" alt="Chiikawa" width="383" height="396">
      <h1>Daily Chiikawa Trivia</h1>
      <p id="day-label" class="muted"></p>
    </header>

    <section id="start-screen" class="panel">
      <p>Five questions, 30 seconds each, one try per day. See how you stack up against everyone who played today.</p>
      <button id="start-btn" class="btn primary">Start today's quiz</button>
    </section>

    <section id="quiz-screen" class="panel" hidden>
      <div class="quiz-top">
        <p id="progress" class="muted"></p>
        <p id="timer-text" class="timer-text"></p>
      </div>
      <div class="timer-bar" aria-hidden="true"><div id="timer-fill" class="timer-fill"></div></div>
      <h2 id="question-text"></h2>
      <div id="choices" class="choices"></div>
      <button id="next-btn" class="btn primary" hidden>Next question</button>
    </section>

    <section id="result-screen" class="panel" hidden>
      <h2 id="result-score"></h2>
      <p id="result-grid" class="grid" aria-label="Your answers"></p>
      <p id="result-time" class="muted"></p>
      <button id="share-btn" class="btn">Copy result</button>
    </section>

    <section id="stats-panel" class="panel" hidden>
      <h3>How you compare today</h3>
      <p id="percentile" class="percentile">Loading today's results...</p>
      <div id="chart" class="chart" role="img"></div>
      <p id="stats-note" class="muted"></p>
    </section>
  </main>

  <div id="enter-screen" class="enter-screen" hidden>
    <button id="enter-btn" class="enter-card">
      <img src="Images/ChiikawaModerDesign.webp" alt="" width="383" height="396">
      <span class="enter-title">Daily Chiikawa Trivia</span>
      <span class="enter-hint">Tap to enter ♪</span>
    </button>
  </div>

  <button id="crucify-btn" class="btn crucify-btn">crucify</button>

  <div id="crucify-overlay" class="crucify-overlay" hidden>
    <div class="crucify-frame">
      <img class="crucify-momonga" src="Images/momonga.jpg" alt="Momonga">
      <span class="crucify-credit">@fluffysaimai_II</span>
    </div>
    <img id="crucify-fire" class="crucify-fire" alt="">
    <audio id="crucify-sound" src="sound/momongaburning.mp3" preload="auto"></audio>
  </div>

  <div class="music-player">
    <audio id="bg-music" src="song/パジャマパーティーズのうた.mp3" loop preload="auto"></audio>
    <button id="music-toggle" class="music-btn" aria-label="Play music">▶</button>
    <input id="music-volume" class="music-volume" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Music volume">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
